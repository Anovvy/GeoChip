services:
  geochip:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: geochip
    image: geochip:latest
    stdin_open: true # Allows interactive keypresses (arrow keys / Enter)
    tty: true        # Allocates pseudo-TTY for ANSI colors and live UI
    volumes:
      # Mount data directories to persist AOIs, raw GeoTIFFs, output chips, and credentials
      - ./data:/app/data
      # Mount Google Earth Engine host credentials cache for seamless authentication
      - ~/.config/earthengine:/root/.config/earthengine
      # Mount package code for live updates without container rebuild
      - ./geochip:/app/geochip
    environment:
      - PYTHONUNBUFFERED=1
      - PYTHONIOENCODING=utf-8
      - GEOCHIP_DOCKER=1
