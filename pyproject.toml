[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geochip"
version = "0.1.0"
description = "Automated pipeline for scraping Sentinel-2 imagery & Google Satellite Embeddings, paired chipping, and Roboflow upload."
readme = "README.md"
requires-python = ">=3.9"
license = {text = "MIT"}
authors = [
    {name = "GeoChip Contributors"}
]
dependencies = [
    "earthengine-api>=1.0.0",
    "pyshp>=2.3.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    "scikit-learn>=1.2.0",
    "pillow>=9.5.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "roboflow>=1.1.0",
]

[project.scripts]
geochip = "geochip.cli:main"
