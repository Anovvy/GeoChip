[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "geochip"
version = "2.0.0"
description = "Interactive CLI pipeline for multi-satellite imagery ingestion, single-raster chipping, and Roboflow annotation."
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
authors = [
    {name = "GeoChip Contributors"}
]
dependencies = [
    "earthengine-api>=1.0.0",
    "pyshp>=2.3.0",
    "rasterio>=1.3.0",
    "numpy>=1.24.0",
    "pillow>=9.5.0",
    "requests>=2.28.0",
    "tqdm>=4.65.0",
    "python-dotenv>=1.0.0",
    "roboflow>=1.1.0",
]

[project.scripts]
geochip = "geochip.cli:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["geochip*"]
exclude = ["data*", "tests*"]
